<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Preview Screenshots</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #161010;
    --surface: #241a17;
    --surface-hover: #2f2320;
    --border: #4a3a35;
    --text: #f0e6e2;
    --text-muted: #b8a89f;
    --accent: #f2994a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  #filters {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px 8px;
    margin: 0;
  }
  legend {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    padding: 0 4px;
  }
  fieldset label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 2px 8px 2px 0;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  #toolbar button {
    background: var(--surface-hover);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #toolbar button:hover {
    border-color: var(--accent);
  }
  main {
    padding: 20px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    transition: border-color 0.15s;
  }
  figure:hover {
    border-color: var(--accent);
  }
  figure img {
    display: block;
    width: 100%;
    height: 160px;
    object-fit: cover;
    object-position: top;
    background: #000;
  }
  figcaption {
    padding: 8px 10px;
    font-size: 0.75rem;
    color: var(--text-muted);
    word-break: break-all;
  }
  figcaption .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }
  figcaption .tag {
    background: var(--surface-hover);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.7rem;
  }
  #empty {
    display: none;
    text-align: center;
    color: var(--text-muted);
    padding: 60px 0;
  }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
  }
  #lightbox.open {
    display: flex;
  }
  #lightbox img {
    max-width: min(100%, 1100px);
    max-height: 78vh;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
  }
  #lightbox .caption {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  #lightbox nav {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  #lightbox nav button {
    pointer-events: auto;
    background: rgba(36, 26, 23, 0.8);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.2rem;
    cursor: pointer;
    margin: 0 16px;
  }
  #lightbox nav button:hover {
    border-color: var(--accent);
  }
  #lightbox-close {
    position: absolute;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
  }
</style>
</head>
<body>
<header>
  <h1>Preview Screenshots</h1>
  <div id="filters"></div>
  <div id="toolbar">
    <span id="count"></span>
    <button id="reset-filters" type="button">フィルタをリセット</button>
  </div>
</header>
<main>
  <div id="grid"></div>
  <p id="empty">条件に一致するスクリーンショットがありません</p>
</main>

<div id="lightbox">
  <button id="lightbox-close" type="button" aria-label="閉じる">&times;</button>
  <nav>
    <button id="lightbox-prev" type="button" aria-label="前へ">&#8249;</button>
    <button id="lightbox-next" type="button" aria-label="次へ">&#8250;</button>
  </nav>
  <img id="lightbox-img" alt="" />
  <div class="caption" id="lightbox-caption"></div>
</div>

<script id="manifest-data" type="application/json">__MANIFEST_JSON__</script>
<script>
(function () {
  const manifest = JSON.parse(document.getElementById("manifest-data").textContent);

  // タグキーは manifest の内容から動的に検出する。新しいタグ（例: theme）を
  // manifest.tsv に追加するだけで、このページのフィルタ UI に自動で反映される。
  const tagKeys = [];
  manifest.forEach((entry) => {
    Object.keys(entry.tags || {}).forEach((key) => {
      if (!tagKeys.includes(key)) tagKeys.push(key);
    });
  });

  const valuesByKey = {};
  tagKeys.forEach((key) => {
    const values = new Set();
    manifest.forEach((entry) => {
      const v = entry.tags[key];
      if (v !== undefined) values.add(v);
    });
    valuesByKey[key] = Array.from(values).sort();
  });

  const filtersEl = document.getElementById("filters");
  const checkboxesByKey = {};

  tagKeys.forEach((key) => {
    const fieldset = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = key;
    fieldset.appendChild(legend);

    checkboxesByKey[key] = [];
    valuesByKey[key].forEach((value) => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = true;
      input.dataset.key = key;
      input.dataset.value = value;
      input.addEventListener("change", render);
      label.appendChild(input);
      label.appendChild(document.createTextNode(value));
      fieldset.appendChild(label);
      checkboxesByKey[key].push(input);
    });

    filtersEl.appendChild(fieldset);
  });

  document.getElementById("reset-filters").addEventListener("click", () => {
    tagKeys.forEach((key) => checkboxesByKey[key].forEach((cb) => (cb.checked = true)));
    render();
  });

  function checkedValues(key) {
    return new Set(
      checkboxesByKey[key].filter((cb) => cb.checked).map((cb) => cb.dataset.value),
    );
  }

  function matches(entry) {
    return tagKeys.every((key) => {
      const checked = checkedValues(key);
      if (checked.size === 0) return true;
      const value = entry.tags[key];
      return value !== undefined && checked.has(value);
    });
  }

  const gridEl = document.getElementById("grid");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");
  let visible = [];

  function render() {
    visible = manifest.filter(matches);
    countEl.textContent = visible.length + " / " + manifest.length + " 件";
    gridEl.innerHTML = "";
    emptyEl.style.display = visible.length === 0 ? "block" : "none";

    visible.forEach((entry, index) => {
      const figure = document.createElement("figure");
      figure.addEventListener("click", () => openLightbox(index));

      const img = document.createElement("img");
      img.src = entry.file;
      img.loading = "lazy";
      img.alt = entry.file;
      figure.appendChild(img);

      const caption = document.createElement("figcaption");
      caption.appendChild(document.createTextNode(entry.file));
      const tagsRow = document.createElement("div");
      tagsRow.className = "tags";
      tagKeys.forEach((key) => {
        const value = entry.tags[key];
        if (value === undefined) return;
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = key + ": " + value;
        tagsRow.appendChild(tag);
      });
      caption.appendChild(tagsRow);
      figure.appendChild(caption);

      gridEl.appendChild(figure);
    });
  }

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxCaption = document.getElementById("lightbox-caption");
  let currentIndex = -1;

  function openLightbox(index) {
    currentIndex = index;
    showCurrent();
    lightbox.classList.add("open");
  }

  function showCurrent() {
    const entry = visible[currentIndex];
    if (!entry) return;
    lightboxImg.src = entry.file;
    lightboxImg.alt = entry.file;
    lightboxCaption.textContent = entry.file;
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
  }

  function step(delta) {
    if (visible.length === 0) return;
    currentIndex = (currentIndex + delta + visible.length) % visible.length;
    showCurrent();
  }

  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  document.getElementById("lightbox-prev").addEventListener("click", () => step(-1));
  document.getElementById("lightbox-next").addEventListener("click", () => step(1));
  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", (event) => {
    if (!lightbox.classList.contains("open")) return;
    if (event.key === "Escape") closeLightbox();
    if (event.key === "ArrowLeft") step(-1);
    if (event.key === "ArrowRight") step(1);
  });

  render();
})();
</script>
</body>
</html>
