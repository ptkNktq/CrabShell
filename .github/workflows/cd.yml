name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign のキーレス署名で、この実行を証明する OIDC トークンを受け取るために必要
      id-token: write
    # このジョブは署名の権限（id-token）と GHCR への書き込み権限を持つので、アクションはすべてコミットのハッシュで固定する。
    # タグは後から別のコミットに付け替えられるため。コメントのバージョンは Renovate が更新の判断に使うので消さない。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: build
        env:
          # タグ名やブランチ名をスクリプトに直接展開すると、名前に含まれる $(...) などが実行されるので、環境変数で渡す
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker build --build-arg COMMIT_HASH=${GITHUB_SHA::7} \
            -t ghcr.io/ptknktq/crabshell:latest \
            -t "ghcr.io/ptknktq/crabshell:$REF_NAME" .
          docker push ghcr.io/ptknktq/crabshell:latest
          docker push "ghcr.io/ptknktq/crabshell:$REF_NAME"
          # 署名の対象にするダイジェスト（ghcr.io/ptknktq/crabshell@sha256:...）を取り出す。
          # タグは後から別のイメージに付け替えられるので、署名はダイジェストに対して行う。
          # 2 つのタグは同じイメージを指すので、ダイジェストは 1 つになる。
          digests=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            ghcr.io/ptknktq/crabshell:latest | grep '^ghcr\.io/ptknktq/crabshell@sha256:' || true)
          if [ "$(printf '%s\n' "$digests" | grep -c .)" -ne 1 ]; then
            # ::error:: の注釈になるのは 1 行だけなので、複数あるときも 1 行にまとめて出す
            echo "::error::push したイメージのダイジェストを 1 つに特定できません: $(printf '%s' "$digests" | tr '\n' ' ')"
            exit 1
          fi
          echo "image=$digests" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # キーレス署名（Sigstore）。秘密鍵は持たず、この実行の OIDC トークンで発行される短命の証明書で署名する。
      # 証明書には「どのリポジトリの、どのワークフローが、どの ref で実行されたか」が入り、
      # 本番サーバーはそれを確かめてからイメージを使う。署名はイメージと同じ GHCR に保存される。
      - name: Sign image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: cosign sign --yes "$IMAGE"
      # 本番サーバーと同じ条件で検証し、検証できない署名のままリリースしたことにならないようにする。
      # 本番サーバーが受け付けるのは v* タグからの実行だけなので、ブランチからの手動実行（workflow_dispatch）では行わない。
      # 手動実行でも、実行元に v* タグを選んだ場合は証明書の ref がタグ push と同じになるので、ここでも本番サーバーでも検証を通る。
      # （手動実行は選んだタグの時点のこのファイルで動くので、署名の手順が入る前のタグを選ぶと署名されない）
      # 条件を変えるときは、本番サーバー側の検証の条件と揃える。
      - name: Verify signature
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp '^https://github\.com/ptkNktq/CrabShell/\.github/workflows/cd\.yml@refs/tags/v[^/]+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' > /dev/null
      - name: Notify Discord
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREFIX: ${{ secrets.DISCORD_WEBHOOK_PREFIX }}
          STATUS: ${{ job.status }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping notification."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            title="CD 成功"
            color=3066993
          else
            title="CD 失敗"
            color=15158332
          fi
          short_sha="${SHA:0:7}"
          payload=$(jq -n \
            --arg content "$PREFIX" \
            --arg title "$title" \
            --argjson color "$color" \
            --arg ref "$REF_NAME" \
            --arg sha "$short_sha" \
            --arg commit_url "$SERVER_URL/$REPO/commit/$SHA" \
            --arg run_url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
            '{
              content: $content,
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name: "タグ", value: $ref, inline: true},
                  {name: "コミット", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                  {name: "ワークフロー", value: ("[実行ログを開く](" + $run_url + ")"), inline: false}
                ],
                timestamp: (now | todate)
              }]
            }')
          curl -sS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL" \
            || echo "::warning::Discord notification failed"
